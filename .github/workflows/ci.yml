name: CI

# Build + test gate on the two platforms the project is actually
# developed and verified on: Windows (Vulkan — the original dev machine,
# and the full feature-matrix job) and macOS (Metal, Apple Silicon — the
# primary dev machine since 2026-08). Linux is deliberately absent: it
# would add the rfd/winit/wgpu system-dependency dance for a platform
# nobody runs the editor on yet.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # The two blocking gates: it must compile and the tests must pass.
      - name: Build (all targets)
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      # The headless half (library + `bake` / `exec` / `inspect`) must
      # keep building with no winit / wgpu / egui / rfd in the tree —
      # that's the build an agent, a container or a CI runner uses, and
      # it's easy to break by reaching for a GUI type from a lower layer
      # without noticing.
      - name: Build (headless — no default features)
        run: cargo build --no-default-features --all-targets --verbose

      - name: Test (headless)
        run: cargo test --no-default-features --verbose

      # Two MCP configurations neither of the builds above covers.
      # `--no-default-features` compiles `agent_ops` *without* the
      # schemars derives; the default build has both MCP features on
      # (`gui` turns `mcp-http` on, since the editor hosts a server of
      # its own). That leaves the two headless server builds untested,
      # and each has code the other doesn't compile: `mcp` alone is the
      # stdio-only server, and `mcp-http` adds the HTTP transport
      # without a GUI dragging it in. Build only — serving needs a
      # socket, not a compiler.
      - name: Build (MCP over stdio, headless)
        run: cargo build --no-default-features --features mcp --all-targets --verbose

      - name: Build (MCP over HTTP, headless)
        run: cargo build --no-default-features --features mcp-http --all-targets --verbose


      # Hard gates since the 2026-08 cleanup pass: the tree is at zero
      # clippy warnings and rustfmt-clean (hand-aligned tables carry
      # `#[rustfmt::skip]`), and these keep it there — a new warning or
      # an unformatted hunk fails the build instead of accruing.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      # `rust-version = "1.88"` in Cargo.toml is a promise, and until
      # now an unverified one: it drifts on the first dependency bump or
      # the first use of a newer language feature, and the drift lands
      # on a contributor with an older toolchain as a wall of type
      # errors from somewhere inside the dependency tree — which is the
      # exact experience declaring an MSRV exists to prevent.
      #
      # `check`, not `build`: the question is whether 1.88 can compile
      # this tree, and codegen would add runner minutes without adding
      # an answer. Full features, because that is what a contributor
      # builds — even though the floor itself comes from `image` and
      # `rmcp`, which the headless half carries too.
      #
      # Installed with rustup and invoked as `cargo +1.88.0` rather than
      # by swapping the job's default toolchain: every step above this
      # one is meant to run on stable, and a step that silently
      # redefines `cargo` for its successors is a trap for whoever
      # appends the next one.
      - name: Install Rust (MSRV 1.88)
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Check (MSRV 1.88)
        run: cargo +1.88.0 check --all-targets --verbose

  # The other half of the platform story. Two behaviors regress ONLY
  # here — the explicit first-frame request_redraw in handler::resumed
  # (macOS delivers no initial paint event; miss it and the window is
  # permanently blank) and the ⌘-based primary_modifier() chord handling
  # — plus anything Metal-specific wgpu turns up. Neither can be caught
  # by a unit test on Windows, so an actual macOS build+test run is the
  # only automated line of defense. Kept lean on purpose: macOS runner
  # minutes are the expensive kind, the feature-matrix and lint steps
  # are platform-neutral and already run on the Windows job, so this
  # one is the default build, both test suites, and nothing else.
  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Build (all targets)
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      - name: Test (headless)
        run: cargo test --no-default-features --verbose
