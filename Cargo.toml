[package]
name = "voxelith"
version = "0.1.0"
edition = "2021"
authors = ["Voxelith Contributors"]
description = "Procedural-first voxel asset creation tool with a headless agent interface"
license = "MPL-2.0"
repository = "https://github.com/Lynthar/Voxelith"
# Stated so cargo refuses an older toolchain with one clear line instead
# of a wall of type errors from somewhere in the dependency tree. The
# number comes from the tree, not from taste: `image` (unconditional —
# `io::voxelize` decodes base-color textures) and `rmcp` both declare
# 1.88. This crate's own floor is lower — `Option::is_none_or` in
# `eval` needs 1.82 — so a headless build is not the cheaper case here.
rust-version = "1.88"

[features]
default = ["gui", "mcp"]
# The interactive editor: window, GPU, egui panels, native file pickers.
# Turning it off (`--no-default-features`) drops winit / wgpu / egui / rfd
# out of the dependency tree entirely and leaves the library plus the
# headless subcommands (`bake`, `exec`, `inspect`, and `mcp` when that
# feature is on) — which is what an agent, a CI runner, or a container
# actually needs. `prefs` goes with the GUI: every field in it is editor
# workspace state.
gui = [
    # The editor hosts an MCP server of its own, so an agent can edit the
    # project someone has open rather than a file on disk. Its transport
    # has to be one an agent can dial into, which rules out stdio — the
    # editor doesn't have one to offer. Hence: an editor build is an
    # `mcp-http` build.
    "mcp-http",
    "dep:wgpu",
    "dep:winit",
    "dep:pollster",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:rfd",
    # `prefs` is the editor's saved workspace and nothing else reads it,
    # so its two dependencies belong to the editor too.
    "dep:ron",
    "dep:dirs",
]

# `voxelith mcp`: the same editing primitives as a resident MCP tool set,
# for agents that speak the protocol rather than shell commands. Carries
# `schemars` because the tool schemas are *generated from the ops types* —
# over MCP the schema is the only place an agent can learn the ops format,
# so a hand-written one would be exactly the drift the generator registry
# exists to avoid. Off, the derives vanish and `agent_ops` is untouched.
mcp = ["dep:rmcp", "dep:schemars", "dep:base64", "dep:tokio"]

# Streamable HTTP: for agents that want a URL instead of a child
# process, and — since an editor can't hand an agent its stdio — the only
# transport the in-editor bridge can offer. Still its own feature so a
# headless stdio-only build doesn't drag axum + tower in, but no longer
# an optional extra: `gui` turns it on, because that bridge is part of
# what the editor is.
mcp-http = ["mcp", "rmcp/transport-streamable-http-server", "dep:axum"]

[dependencies]
# Graphics & Windowing (GUI only — see the `gui` feature)
wgpu = { version = "22", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }  # Block on async for wgpu initialization

# UI (GUI only)
egui = { version = "0.29", optional = true }
egui-wgpu = { version = "0.29", optional = true }
egui-winit = { version = "0.29", optional = true }

# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `prefs.ron` only — hence `optional`, pulled in by `gui`. Still 0.8:
# internally tagged enums need 0.9, which is why the pipeline graph
# lives in the JSON half of a `.vxlt` rather than here.
ron = { version = "0.8", optional = true }

# CLI (headless batch export: `voxelith bake <spec.json>`)
clap = { version = "4", features = ["derive", "env"] }

# Utilities
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"  # Better mutexes
flate2 = "1.0"  # Compression for project files
rfd = { version = "0.15", optional = true }  # Native file dialogs (GUI only)
# Where `prefs.ron` and the crash-recovery autosave live. GUI-only for
# the same reason as `ron`.
dirs = { version = "5.0", optional = true }

# MCP server (`mcp` / `mcp-http` features). `transport-io` is the stdio
# transport; `server` + `macros` come in by default. `schemars` generates
# the tool argument schemas straight from the `agent_ops` types — the
# version tracks the one rmcp itself pins so both see the same trait.
rmcp = { version = "3.1", optional = true, features = ["transport-io"] }
schemars = { version = "1.0", optional = true }
axum = { version = "0.8", optional = true }
# Only the MCP server needs this: over the protocol an image is a base64
# string, while `voxelith render` writes the same PNG bytes to a file.
base64 = { version = "0.22", optional = true }

# Parallelism
rayon = "1.10"

# Noise (for procedural generation)
noise = "0.9"
rand = "0.8"

# Reading glTF: `io::voxelize` parses an incoming `.glb` so File ▸ Import
# can turn a mesh into voxels. Export is unrelated and needs nothing from
# here — `io::gltf` is this crate's own module and writes the format by
# hand.
gltf = "1"

# Async runtime. Owned by `mcp`, which is the only thing that needs one:
# the stdio/HTTP servers, and — because `gui` implies `mcp-http` — the
# editor's background runtime that the in-editor agent bridge runs on.
# A build with neither (`bake` / `exec` / `inspect` / `render` / `eval`)
# has no async anything.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

# PNG encodes `voxelith render` / `render_views` — an agent's eyes, which
# work in a container with no display, so this is neither GUI nor AI.
# JPEG decodes whatever base-color texture an imported GLB happens to
# carry.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Embeds assets/branding/voxelith.ico into the .exe as its resource icon
# (Explorer, taskbar pins, shortcuts). The running window's icon is a
# separate mechanism — `window_icon()` in src/app/handler.rs. Keyed to
# Windows so the headless-in-a-container build (Linux) doesn't carry
# it; build.rs `#[cfg]`s its only use out on the same condition.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Applies to every feature variant; the gate is `cargo clippy --all-targets
# -- -D warnings`, so `warn` here is an error there.
[lints.rust]
unsafe_code = "forbid"
# `unused` is a group: without a lower priority it would override the
# single-lint entries, and clippy's `lint_groups_priority` refuses that.
unused = { level = "deny", priority = -1 }

# Listed one by one rather than `pedantic = "warn"` + allows: every name
# here is zero-hit on all four variants, and a name missing here means
# open hits or a deliberate pass, never an allow hiding a hit.
[lints.clippy]
# Numeric conversions and comparisons that silently change a value.
checked_conversions = "warn"
invalid_upcast_comparisons = "warn"
decimal_bitwise_operands = "warn"
manual_ilog2 = "warn"
manual_is_power_of_two = "warn"
needless_bitwise_bool = "warn"
verbose_bit_mask = "warn"
unchecked_time_subtraction = "warn"
manual_instant_elapsed = "warn"
duration_suboptimal_units = "warn"
# Control flow that hides a case: wildcard arms, repeated conditions,
# `Err(_)` swallowed, boolean tangles.
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
same_functions_in_if_condition = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
comparison_chain = "warn"
collapsible_else_if = "warn"
if_not_else = "warn"
match_bool = "warn"
manual_let_else = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
redundant_else = "warn"
needless_continue = "warn"
unnested_or_patterns = "warn"
index_refutable_slice = "warn"
ignored_unit_patterns = "warn"
maybe_infinite_iter = "warn"
# Iterators and collections used in a way that costs or misleads.
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
needless_for_each = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
manual_is_variant_and = "warn"
cloned_instead_of_copied = "warn"
copy_iterator = "warn"
option_as_ref_cloned = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
format_collect = "warn"
unnecessary_join = "warn"
with_capacity_zero = "warn"
same_length_and_capacity = "warn"
zero_sized_map_values = "warn"
linkedlist = "warn"
stable_sort_primitive = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
# Strings and text: newline handling, extension case, NFC, literals.
str_split_at_newline = "warn"
string_add_assign = "warn"
case_sensitive_file_extension_comparisons = "warn"
unicode_not_nfc = "warn"
single_char_pattern = "warn"
manual_string_new = "warn"
needless_raw_string_hashes = "warn"
unreadable_literal = "warn"
large_digit_groups = "warn"
ip_constant = "warn"
unnecessary_debug_formatting = "warn"
# Signatures and types: what a caller can pass, what they must not drop.
ref_option = "warn"
ref_option_ref = "warn"
option_option = "warn"
return_self_not_must_use = "warn"
unnecessary_box_returns = "warn"
unnecessary_literal_bound = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
large_futures = "warn"
elidable_lifetime_names = "warn"
mismatching_type_param_order = "warn"
inconsistent_struct_constructor = "warn"
into_iter_without_iter = "warn"
iter_without_into_iter = "warn"
iter_not_returning_iterator = "warn"
missing_fields_in_debug = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
ref_binding_to_reference = "warn"
mut_mut = "warn"
redundant_closure_for_method_calls = "warn"
inline_always = "warn"
# Names and scope: glob imports, underscore items, items after statements.
wildcard_imports = "warn"
enum_glob_use = "warn"
macro_use_imports = "warn"
used_underscore_items = "warn"
no_effect_underscore_binding = "warn"
self_only_used_in_recursion = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
unnecessary_trailing_comma = "warn"
# Docs and tests: broken links, `#[ignore]` without a reason,
# `#[should_panic]` that accepts any panic.
doc_broken_link = "warn"
doc_link_with_quotes = "warn"
doc_comment_double_space_linebreaks = "warn"
ignore_without_reason = "warn"
should_panic_without_expect = "warn"

[profile.dev]
opt-level = 1  # Some optimization for faster debug builds

[profile.dev.package."*"]
opt-level = 3  # Full optimization for dependencies

[profile.release]
lto = "thin"
codegen-units = 1
