[package]
name = "voxelith"
version = "0.1.0"
edition = "2021"
authors = ["Voxelith Contributors"]
description = "Procedural-first voxel asset creation tool with a headless agent interface"
license = "MIT"
repository = "https://github.com/Lynthar/Voxelith"

[features]
default = ["gui", "mcp"]
# The interactive editor: window, GPU, egui panels, native file pickers.
# Turning it off (`--no-default-features`) drops winit / wgpu / egui / rfd
# out of the dependency tree entirely and leaves the library plus the
# headless subcommands (`bake`, `exec`, `inspect`, and `mcp` when that
# feature is on) — which is what an agent, a CI runner, or a container
# actually needs. `prefs` goes with the GUI: every field in it is editor
# workspace state.
gui = [
    # The editor hosts an MCP server of its own, so an agent can edit the
    # project someone has open rather than a file on disk. Its transport
    # has to be one an agent can dial into, which rules out stdio — the
    # editor doesn't have one to offer. Hence: an editor build is an
    # `mcp-http` build.
    "mcp-http",
    "dep:wgpu",
    "dep:winit",
    "dep:pollster",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:rfd",
]

# `voxelith mcp`: the same editing primitives as a resident MCP tool set,
# for agents that speak the protocol rather than shell commands. Carries
# `schemars` because the tool schemas are *generated from the ops types* —
# over MCP the schema is the only place an agent can learn the ops format,
# so a hand-written one would be exactly the drift the generator registry
# exists to avoid. Off, the derives vanish and `agent_ops` is untouched.
mcp = ["dep:rmcp", "dep:schemars", "dep:base64", "dep:tokio"]

# Streamable HTTP: for agents that want a URL instead of a child
# process, and — since an editor can't hand an agent its stdio — the only
# transport the in-editor bridge can offer. Still its own feature so a
# headless stdio-only build doesn't drag axum + tower in, but no longer
# an optional extra: `gui` turns it on, because that bridge is part of
# what the editor is.
mcp-http = ["mcp", "rmcp/transport-streamable-http-server", "dep:axum"]

[dependencies]
# Graphics & Windowing (GUI only — see the `gui` feature)
wgpu = { version = "22", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }  # Block on async for wgpu initialization

# UI (GUI only)
egui = { version = "0.29", optional = true }
egui-wgpu = { version = "0.29", optional = true }
egui-winit = { version = "0.29", optional = true }

# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ron = "0.8"  # Rusty Object Notation for config files

# CLI (headless batch export: `voxelith bake <spec.json>`)
clap = { version = "4", features = ["derive"] }

# Utilities
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"  # Better mutexes
flate2 = "1.0"  # Compression for project files
rfd = { version = "0.15", optional = true }  # Native file dialogs (GUI only)
dirs = "5.0"  # Cross-platform user config / cache / data directories

# MCP server (`mcp` / `mcp-http` features). `transport-io` is the stdio
# transport; `server` + `macros` come in by default. `schemars` generates
# the tool argument schemas straight from the `agent_ops` types — the
# version tracks the one rmcp itself pins so both see the same trait.
rmcp = { version = "3.1", optional = true, features = ["transport-io"] }
schemars = { version = "1.0", optional = true }
axum = { version = "0.8", optional = true }
# Only the MCP server needs this: over the protocol an image is a base64
# string, while `voxelith render` writes the same PNG bytes to a file.
base64 = { version = "0.22", optional = true }

# Parallelism
rayon = "1.10"

# Noise (for procedural generation)
noise = "0.9"
rand = "0.8"

# Reading glTF: `io::voxelize` parses an incoming `.glb` so File ▸ Import
# can turn a mesh into voxels. Export is unrelated and needs nothing from
# here — `io::gltf` is this crate's own module and writes the format by
# hand.
gltf = "1"

# Async runtime. Owned by `mcp`, which is the only thing that needs one:
# the stdio/HTTP servers, and — because `gui` implies `mcp-http` — the
# editor's background runtime that the in-editor agent bridge runs on.
# A build with neither (`bake` / `exec` / `inspect` / `render` / `eval`)
# has no async anything.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

# PNG encodes `voxelith render` / `render_views` — an agent's eyes, which
# work in a container with no display, so this is neither GUI nor AI.
# JPEG decodes whatever base-color texture an imported GLB happens to
# carry.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Embeds assets/branding/voxelith.ico into the .exe as its resource icon
# (Explorer, taskbar pins, shortcuts). The running window's icon is a
# separate mechanism — `window_icon()` in src/app/handler.rs. Keyed to
# Windows so the headless-in-a-container build (Linux) doesn't carry
# it; build.rs `#[cfg]`s its only use out on the same condition.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1  # Some optimization for faster debug builds

[profile.dev.package."*"]
opt-level = 3  # Full optimization for dependencies

[profile.release]
lto = "thin"
codegen-units = 1
