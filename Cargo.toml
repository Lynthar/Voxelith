[package]
name = "voxelith"
version = "0.1.0"
edition = "2021"
authors = ["Voxelith Contributors"]
description = "Procedural-first voxel asset creation tool with AI generation capabilities"
license = "MIT"
repository = "https://github.com/Lynthar/Voxelith"

[features]
default = ["gui"]
# The interactive editor: window, GPU, egui panels, native file pickers.
# Turning it off (`--no-default-features`) drops winit / wgpu / egui / rfd
# out of the dependency tree entirely and leaves the library plus the
# headless subcommands (`bake`, `exec`, `inspect`) — which is what an
# agent, a CI runner, or a container actually needs. `prefs` goes with
# the GUI: every field in it is editor workspace state.
gui = [
    "dep:wgpu",
    "dep:winit",
    "dep:pollster",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:rfd",
]

[dependencies]
# Graphics & Windowing (GUI only — see the `gui` feature)
wgpu = { version = "22", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }  # Block on async for wgpu initialization

# UI (GUI only)
egui = { version = "0.29", optional = true }
egui-wgpu = { version = "0.29", optional = true }
egui-winit = { version = "0.29", optional = true }

# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.19", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ron = "0.8"  # Rusty Object Notation for config files

# CLI (headless batch export: `voxelith bake <spec.json>`)
clap = { version = "4", features = ["derive"] }

# Utilities
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"  # Better mutexes
flate2 = "1.0"  # Compression for project files
rfd = { version = "0.15", optional = true }  # Native file dialogs (GUI only)
dirs = "5.0"  # Cross-platform user config / cache / data directories

# Parallelism
rayon = "1.10"

# Noise (for procedural generation)
noise = "0.9"
rand = "0.8"

# AI integration: HTTP client for remote 3D-gen APIs (fal.ai, etc.),
# tokio runtime to run them off the winit main thread, keyring for
# storing API keys in the OS keychain instead of plaintext prefs.
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
keyring = "3"
# GLB → voxel conversion for AI output: gltf parses the binary glTF
# the provider returns; image decodes the PBR base-color texture so we
# can sample colors at triangle UVs (Hunyuan3D V3 doesn't ship vertex
# colors, only textures).
gltf = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 1  # Some optimization for faster debug builds

[profile.dev.package."*"]
opt-level = 3  # Full optimization for dependencies

[profile.release]
lto = "thin"
codegen-units = 1
